<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Wyoming LLC Attorney</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://www.wyomingllclimited.xyz/">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#1e3a8a',
                        orange: '#f97316',
                        'purple-custom': '#6366f1',
                        primary: '#0f766e',
                        secondary: '#fb923c',
                        accent: '#8b5cf6'
                    }
                }
            }
        }
    </script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <header class="bg-white/95 backdrop-blur shadow-sm border-b border-slate-100">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center">
                <img src="assets/wyoming.png" alt="Wyoming LLC Attorney" class="h-10 w-auto" />
            </a>
            <a href="login.html"
               class="px-4 py-2 text-sm font-semibold text-slate-700 border border-slate-200 rounded-lg hover:border-primary hover:text-primary transition">
                Back to login
            </a>
        </div>
    </header>

    <main class="flex-1">
        <section class="bg-gradient-to-br from-slate-900 via-primary to-teal-900 py-10 lg:py-16">
            <div class="max-w-md mx-auto px-4">
                <div class="text-center mb-8">
                    <h1 class="text-3xl lg:text-4xl font-extrabold text-white mb-3">Reset Password</h1>
                    <p class="text-sm md:text-base text-slate-100/80 leading-relaxed">
                        Enter the email address on your account and we will send a reset link.
                    </p>
                </div>

                <div class="bg-white/95 backdrop-blur-lg rounded-3xl shadow-2xl border border-white/40 p-6 md:p-8">
                    <div id="error-message" role="alert" aria-live="polite"
                         class="hidden bg-red-50 border border-red-300 text-red-800 px-4 py-3 rounded-xl mb-4 text-sm">
                    </div>
                    <div id="success-message" role="status" aria-live="polite"
                         class="hidden bg-emerald-50 border border-emerald-300 text-emerald-800 px-4 py-3 rounded-xl mb-4 text-sm">
                    </div>

                    <form id="reset-form" class="space-y-5">
                        <div>
                            <label for="reset-email" class="block text-sm font-medium text-slate-700 mb-2">Email Address</label>
                            <input type="email" id="reset-email" name="email" autocomplete="email" required
                                   class="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-colors"
                                   placeholder="Enter your email address">
                        </div>
                        <button type="submit" id="reset-submit"
                                class="w-full bg-gradient-to-r from-secondary to-yellow-400 hover:from-yellow-400 hover:to-secondary disabled:bg-slate-300 text-slate-900 font-semibold py-3.5 px-6 rounded-2xl transition-colors duration-200">
                            Send reset link
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-white border-t border-slate-200">
        <div class="max-w-4xl mx-auto px-4 py-6 text-center text-slate-500 text-xs">
            <p>&copy; 2024 Wyoming LLC Attorney. All rights reserved.</p>
        </div>
    </footer>

    <script>
        (function () {
            'use strict';
            var form = document.getElementById('reset-form');
            var emailInput = document.getElementById('reset-email');
            var submit = document.getElementById('reset-submit');
            var errorEl = document.getElementById('error-message');
            var successEl = document.getElementById('success-message');

            form.addEventListener('submit', function (event) {
                event.preventDefault();

                var email = emailInput.value.trim();
                errorEl.classList.add('hidden');
                successEl.classList.add('hidden');

                if (!email) {
                    errorEl.textContent = 'Enter your email address.';
                    errorEl.classList.remove('hidden');
                    return;
                }

                submit.disabled = true;
                submit.textContent = 'Sending...';

                Auth.resetPassword(email).then(function (result) {
                    submit.disabled = false;
                    submit.textContent = 'Send reset link';

                    if (!result.success) {
                        errorEl.textContent = result.error || Auth.friendly(result.code);
                        errorEl.classList.remove('hidden');
                        return;
                    }

                    successEl.textContent = 'If that address matches an account, a reset link is on its way.';
                    successEl.classList.remove('hidden');
                    form.reset();
                });
            });
        })();
    </script>
</body>
</html>
